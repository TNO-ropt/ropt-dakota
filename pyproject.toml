[build-system]
requires = ["setuptools", "setuptools-scm>=8.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ropt-dakota"
description = "A Dakota optimizer plugin for ropt"
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Natural Language :: English",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = ["numpy", "carolina"]

[project.urls]
"Homepage" = "https://github.com/TNO-ropt/ropt-dakota"
"Repository" = "https://github.com/TNO-ropt/ropt-dakota"
"Bug Tracker" = "https://github.com/TNO-ropt/ropt-dakota/issues"
"Documentation" = "https://tno-ropt.github.io/ropt-dakota"

[project.entry-points."ropt.plugins.backend"]
dakota = "ropt_dakota.dakota:DakotaBackendPlugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ropt_dakota = ["py.typed"]

[tool.setuptools_scm]
version_file = "src/ropt_dakota/version.py"
fallback_version = "0.0.0.dev0"

[tool.pytest.ini_options]
markers = ["external: external optimizer marker"]
filterwarnings = [
    "error",
    'ignore:numpy.ndarray size changed, may indicate binary incompatibility.*:RuntimeWarning',
]

[tool.ruff.format]
exclude = ["src/ropt_dakota/version.py", "build"]

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = ["missing-trailing-comma", "CPY", "line-too-long", "assert"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "D",
    "any-type",
    "import-private-name",
    "magic-value-comparison",
    "too-many-arguments",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["dakota", "cloudpickle"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mike",
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]",
    "mypy",
    "pytest",
    "ruff",
]
